<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    
    <!-- Instant redirect via HTML Meta Refresh (0 seconds delay) -->
    <meta http-equiv="refresh" content="0; url=https://censun.org">
    
    <!-- Canonical tag to help search engines understand the destination -->
    <link rel="canonical" href="https://censun.org">
    
    <!-- JavaScript redirect as a faster, cleaner fallback -->
    <script>
        window.location.replace("https://censun.org");
    </script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f9fafb;
            color: #111827;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        a {
            color: #2563eb;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <p>Redirecting you to the new page...</p>
        <!-- Manual fallback link if both Meta Refresh and JS are blocked -->
        <p>If you are not redirected automatically, <a href="https://censun.org">click here</a>.</p>
    </div>
</body>
</html>
